          <p class="eyebrow">Organigrama Abierto · En construcción</p>
          <h1>Organigrama Abierto: los cargos del Estado y sus fuentes públicas.</h1>
          <p>Para ciudadanos y periodistas. Iniciativa independiente en construcción; no es un canal oficial ni una consulta operativa.</p>
          <section id="problema"><h2>El problema</h2><p>La información sobre cargos está dispersa en documentos públicos y puede quedar desactualizada.</p></section>
          <section id="metodo"><h2>Cómo funciona</h2><p>Fuentes oficiales, validación humana antes de publicar y publicación semanal. El corte de los lunes reúne lo validado hasta el viernes.</p><p>Ejecutivo hasta direcciones de línea; organismos adscritos solo alta dirección. Legislativo: mesas directivas, parlamentarios, presidentes de comisión y alta dirección administrativa. Judicial: Presidencia, jueces supremos, presidentes de cortes superiores y gerencia general. Organismos constitucionales autónomos fuera de la primera versión.</p></section>
          <section id="para-quien"><h2>Para quién</h2><p>Ciudadanos y periodistas podrán consultar cada cargo con su fuente.</p></section>
          <!-- platform-fallback -->
          <section id="principios"><h2>Principios</h2><p>Cada dato con su fuente, neutralidad: se enlaza, no se opina; protección de datos personales.</p></section>
          <section id="cierre"><h2>En construcción</h2><p>Conoce la propuesta sin promesas de lanzamiento.</p><a href="#plataforma">Conoce la plataforma</a></section>
